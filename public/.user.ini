; Límites de PHP para cargas grandes en hosting compartido (Hostinger, LiteSpeed/PHP-FPM).
; .user.ini es leído por PHP-FPM/CGI/LiteSpeed (a diferencia de php_value en .htaccess, que
; solo aplica con PHP como módulo de Apache). Ajusta si el hosting permite más.
upload_max_filesize = 60M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
